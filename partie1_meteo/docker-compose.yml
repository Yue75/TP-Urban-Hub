# UrbanHub - Partie 1 (meteo) : MinIO + JupyterLab/PySpark
# Memes identifiants et meme bucket que le reste de l'equipe (urbanhub / urbanhub123, bucket "urbanhub").
services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: urbanhub-minio
    user: "0:0"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: urbanhub
      MINIO_ROOT_PASSWORD: urbanhub123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  jupyter:
    image: quay.io/jupyter/pyspark-notebook:2024-05-27
    container_name: urbanhub-jupyter
    command: start-notebook.py --IdentityProvider.token=''
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: urbanhub
      MINIO_SECRET_KEY: urbanhub123
      MINIO_BUCKET: urbanhub
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./scripts:/home/jovyan/work/scripts
      - ./data:/home/jovyan/work/data
    depends_on:
      - minio

volumes:
  minio_data:
