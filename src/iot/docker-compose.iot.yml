# Partie 3 (IoT / OpenAQ) : a COPIER dans le docker-compose.yml d'Antoine,
# sous "services:" (a cote de minio, collector et spark), avant la ligne "volumes:".
# Prerequis : un fichier .env a la racine avec OPENAQ_API_KEY=... (ignore par Git).
# Lancer : docker compose up -d --build minio iot_collector
# Analyses : docker compose run --rm iot_analysis

  iot_collector:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: urbanhub:latest
    container_name: urbanhub_iot
    command: python -m iot.run
    environment:
      <<: *urbanhub-env
      IOT_STORE: s3
      OPENAQ_API_KEY: ${OPENAQ_API_KEY}
      IOT_BACKFILL_DAYS: "30"
      IOT_INTERVAL_MIN: "15"
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  iot_analysis:
    image: urbanhub:latest
    container_name: urbanhub_iot_analysis
    command: python -m iot.analysis
    environment:
      <<: *urbanhub-env
      IOT_STORE: s3
    volumes:
      - ./outputs:/app/outputs
      - ./src:/app/src
    depends_on:
      minio:
        condition: service_healthy
    profiles: ["batch"]